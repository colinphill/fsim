# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-llvm22:
    name: Ubuntu / Clang 22 / LLVM 22.1.8 / ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            build_dir: build/ci-linux-llvm22-debug
            artifact: github-linux-clang22-llvm22-debug
            retained_log: build/qualification/ci-linux-clang22-llvm22-debug.log
          - configuration: Release
            build_dir: build/ci-linux-llvm22-release
            artifact: github-linux-clang22-llvm22-release
            retained_log: build/qualification/ci-linux-clang22-llvm22-release.log
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Initialize retained lane log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${{ matrix.retained_log }}")"
          printf 'artifact=%s\nconfiguration=%s\n' \
            "${{ matrix.artifact }}" \
            "${{ matrix.configuration }}" > "${{ matrix.retained_log }}"

      - name: Install Clang and LLVM 22.1.8 development packages
        shell: bash
        run: |
          set -euo pipefail
          {
            llvm_installer="${RUNNER_TEMP}/llvm-22-installer.sh"
            wget --quiet --output-document="${llvm_installer}" \
              https://apt.llvm.org/llvm.sh
            chmod +x "${llvm_installer}"
            sudo "${llvm_installer}" 22
            sudo apt-get install --yes --no-install-recommends \
              clang-22 \
              llvm-22-dev

            installed_version=$(/usr/lib/llvm-22/bin/llvm-config --version)
            if [[ "${installed_version}" != "22.1.8" ]]; then
              echo "Expected LLVM 22.1.8, found ${installed_version}" >&2
              exit 1
            fi
            clang-22 --version
            clang++-22 --version
          } 2>&1 | tee -a "${{ matrix.retained_log }}"

      - name: Configure with required LLVM backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.configuration }}" \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DFSIM_BUILD_TESTS=ON \
            -DFSIM_LLVM_MODE=ON \
            -DFSIM_WARNINGS_AS_ERRORS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm 2>&1 \
            | tee -a "${{ matrix.retained_log }}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "${{ matrix.build_dir }}" --parallel 2 2>&1 \
            | tee -a "${{ matrix.retained_log }}"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "${{ matrix.build_dir }}" \
            --parallel 2 \
            --output-on-failure 2>&1 \
            | tee -a "${{ matrix.retained_log }}"

      - name: Upload retained lane log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.retained_log }}
          if-no-files-found: error

  windows-llvm-mingw:
    name: Windows / LLVM-MinGW / ${{ matrix.configuration }} / LLVM ${{ matrix.llvm_mode }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            llvm_mode: 'ON'
            build_dir: build/ci-windows-llvm-mingw-Debug-llvm-ON
            artifact: github-windows-debug-llvm-on
            retained_log: build/qualification/ci-windows-debug-llvm-on.log
          - configuration: Release
            llvm_mode: 'ON'
            build_dir: build/ci-windows-llvm-mingw-Release-llvm-ON
            artifact: github-windows-release-llvm-on
            retained_log: build/qualification/ci-windows-release-llvm-on.log
            binary_package: fsim-v3.0.0-windows-x86_64-llvm-mingw-llvm22
            binary_archive: fsim-v3.0.0-windows-x86_64-llvm-mingw-llvm22.zip
            binary_log: build/qualification/ci-windows-llvm22-archive.log
            install_log: build/qualification/ci-windows-llvm22-install.log
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Initialize retained lane log
        shell: pwsh
        run: |
          $logPath = "${{ matrix.retained_log }}"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $logPath) | Out-Null
          @(
            "artifact=${{ matrix.artifact }}"
            "configuration=${{ matrix.configuration }}"
            "llvm_mode=${{ matrix.llvm_mode }}"
          ) | Set-Content -LiteralPath $logPath -Encoding utf8

      - name: Install and validate the fsim toolchain 22.1.8-1
        shell: pwsh
        run: |
          & ./.github/scripts/install-windows-llvm-mingw.ps1 `
            -Release "20260616" `
            -Toolchain "fsim-toolchain-22.1.8-1" `
            -Version "22.1.8" `
            -ArchiveUrl "https://github.com/colinphill/fsim-toolchain/releases/download/fsim-22.1.8-1/fsim-toolchain-22.1.8-1-ucrt-x86_64.zip" `
            -Sha256 "f774dabc63f47a3cf0ed2e042a32666402249d932315f2e8a8de851a39555133" `
            -DevArchiveUrl "https://github.com/colinphill/fsim-toolchain/releases/download/fsim-22.1.8-1/fsim-toolchain-22.1.8-1-ucrt-x86_64-llvm-dev.zip" `
            -DevSha256 "7c18e6f6969784d9006d9e486cd667a6790fe2031967d481de790849c163d6dc" `
            -RedistArchiveUrl "https://github.com/colinphill/fsim-toolchain/releases/download/fsim-22.1.8-1/fsim-toolchain-22.1.8-1-ucrt-x86_64-redist.zip" `
            -RedistSha256 "f90acc819f8174ff734e4a4f746756eeec07d607436baa9813d3f81c8efc6744" `
            2>&1 | Tee-Object -FilePath "${{ matrix.retained_log }}" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: pwsh
        run: |
          $buildDirectory = "${{ matrix.build_dir }}"
          $arguments = @(
            "-S", ".",
            "-B", $buildDirectory,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=${{ matrix.configuration }}",
            "-DCMAKE_C_COMPILER=$env:LLVM_MINGW_ROOT/bin/clang.exe",
            "-DCMAKE_CXX_COMPILER=$env:LLVM_MINGW_ROOT/bin/clang++.exe",
            "-DCMAKE_RC_COMPILER=$env:LLVM_MINGW_ROOT/bin/llvm-windres.exe",
            "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF",
            "-DFSIM_BUILD_TESTS=ON",
            "-DFSIM_TCL_MODE=ON",
            "-DFSIM_LLVM_MODE=${{ matrix.llvm_mode }}",
            "-DFSIM_WARNINGS_AS_ERRORS=ON",
            "-DFSIM_WINDOWS_TOOLCHAIN_REDIST=$env:FSIM_WINDOWS_TOOLCHAIN_REDIST"
          )
          if ("${{ matrix.llvm_mode }}" -eq "ON") {
            # The toolchain's LLVM development overlay describes the exact
            # libLLVM-22.dll the toolchain ships.
            $arguments += "-DLLVM_DIR=$env:LLVM_MINGW_ROOT/lib/cmake/llvm"
          }
          & cmake @arguments 2>&1 `
            | Tee-Object -FilePath "${{ matrix.retained_log }}" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:LLVM_MINGW_ROOT/bin;$env:LLVM_MINGW_ROOT/busybox/bin;$env:PATH"
          & cmake --build "${{ matrix.build_dir }}" --parallel 2 2>&1 `
            | Tee-Object -FilePath "${{ matrix.retained_log }}" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        env:
          CTEST_OUTPUT_ON_FAILURE: '1'
        run: |
          $env:PATH = "$env:LLVM_MINGW_ROOT/bin;$env:LLVM_MINGW_ROOT/busybox/bin;$env:PATH"
          & ctest --test-dir "${{ matrix.build_dir }}" --parallel 2 --progress --output-on-failure 2>&1 `
            | Tee-Object -FilePath "${{ matrix.retained_log }}" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create deterministic Windows binary archive
        id: windows_archive
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $archiveLog = "${{ matrix.binary_log }}"
          @(
            "package=${{ matrix.binary_package }}"
            "archive=${{ matrix.binary_archive }}"
          ) | Set-Content -LiteralPath $archiveLog -Encoding utf8
          $arguments = @(
            "-DFSIM_SOURCE_DIR=$env:GITHUB_WORKSPACE",
            "-DFSIM_BINARY_DIR=${{ matrix.build_dir }}",
            "-DFSIM_WORK_DIR=${{ matrix.build_dir }}/release-package",
            "-DFSIM_CONFIG=Release",
            "-DFSIM_PLATFORM=Windows-x86_64",
            "-DFSIM_COMPILER=fsim-toolchain-22.1.8-1",
            "-DFSIM_BINARY_ONLY=ON",
            "-DFSIM_BINARY_PACKAGE_NAME=${{ matrix.binary_package }}",
            "-DFSIM_BINARY_ARCHIVE_OUTPUT=$env:GITHUB_WORKSPACE/${{ matrix.binary_archive }}",
            "-P", "cmake/CheckDeterministicPackaging.cmake"
          )
          & cmake @arguments 2>&1 `
            | Tee-Object -FilePath $archiveLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit deterministic Windows install lane
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $installLog = "${{ matrix.install_log }}"
          @(
            "package=${{ matrix.binary_package }}"
            "archive=${{ matrix.binary_archive }}"
            "regression_log=${{ matrix.retained_log }}"
          ) | Set-Content -LiteralPath $installLog -Encoding utf8
          $arguments = @(
            "-DFSIM_SOURCE_DIR=$env:GITHUB_WORKSPACE",
            "-DFSIM_ARCHIVE_AUDIT_BINARY_DIR=${{ matrix.build_dir }}",
            "-DFSIM_ARCHIVE_AUDIT_ARCHIVE=$env:GITHUB_WORKSPACE/${{ matrix.binary_archive }}",
            "-DFSIM_ARCHIVE_AUDIT_ROOT=${{ matrix.binary_package }}",
            "-DFSIM_ARCHIVE_AUDIT_REGRESSION_LOG=$env:GITHUB_WORKSPACE/${{ matrix.retained_log }}",
            "-DFSIM_ARCHIVE_AUDIT_WORK_DIR=${{ matrix.build_dir }}/v3-install-audit",
            "-DFSIM_ARCHIVE_AUDIT_REQUIRED_CTESTS=$env:GITHUB_WORKSPACE/tests/feature_matrix/v3_current_required_ctests.txt",
            "-DFSIM_ARCHIVE_AUDIT_REQUIRED_ENTRIES=$env:GITHUB_WORKSPACE/tests/feature_matrix/v3_installed_archive_required.txt",
            "-DFSIM_ARCHIVE_AUDIT_TOOLCHAIN=fsim-toolchain-22.1.8-1-LLVM-${{ matrix.llvm_mode }}",
            "-DFSIM_ARCHIVE_AUDIT_EXECUTABLE_SUFFIX=.exe",
            "-P", "cmake/CheckV3InstalledArchive.cmake"
          )
          & cmake @arguments 2>&1 `
            | Tee-Object -FilePath $installLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload deterministic Windows binary archive
        if: always() && matrix.configuration == 'Release' && steps.windows_archive.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_archive }}
          path: |
            ${{ matrix.binary_archive }}
            ${{ matrix.binary_log }}
            ${{ matrix.install_log }}
          if-no-files-found: error

      - name: Upload retained lane log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.retained_log }}
          if-no-files-found: error
