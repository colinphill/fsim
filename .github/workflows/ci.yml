# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-gcc:
    name: Ubuntu / GCC / ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: ci-linux
          - configuration: Release
            preset: ci-linux-release
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE '^recursive-closure$'

      - name: Final closure checks
        if: matrix.configuration == 'Debug'
        run: ctest --preset ${{ matrix.preset }} -L '^recursive-closure$'

  linux-llvm22:
    name: Ubuntu / GCC / LLVM 22.1.8 / ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            build_dir: build/ci-linux-llvm22-debug
          - configuration: Release
            build_dir: build/ci-linux-llvm22-release
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install LLVM 22.1.8 development package
        shell: bash
        run: |
          set -euo pipefail
          wget --quiet https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install --yes --no-install-recommends llvm-22-dev

          installed_version=$(/usr/lib/llvm-22/bin/llvm-config --version)
          if [[ "${installed_version}" != "22.1.8" ]]; then
            echo "Expected LLVM 22.1.8, found ${installed_version}" >&2
            exit 1
          fi

      - name: Configure with required LLVM backend
        run: >
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DFSIM_BUILD_TESTS=ON
          -DFSIM_LLVM_MODE=ON
          -DFSIM_WARNINGS_AS_ERRORS=ON
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --parallel 4

      - name: Test
        run: >
          ctest --test-dir ${{ matrix.build_dir }}
          --output-on-failure
          -LE '^recursive-closure$'

  linux-fuzz:
    name: Ubuntu / Clang / frontend fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libclang-rt-dev

      - name: Configure
        run: cmake --preset ci-fuzz

      - name: Build
        run: cmake --build --preset ci-fuzz --parallel 4

      - name: Fuzz lexer and parser
        run: >
          build/ci-fuzz/tests/fuzz/fsim_frontend_fuzz
          -runs=20000
          -seed=1
          -timeout=10
          -max_len=65536
          tests/fuzz/corpus/frontend

  windows-llvm-mingw:
    name: Windows / LLVM-MinGW / ${{ matrix.configuration }} / LLVM ${{ matrix.llvm_mode }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        llvm_mode:
          - 'ON'
          - 'OFF'
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install and validate LLVM-MinGW 20260616
        shell: pwsh
        run: |
          & ./.github/scripts/install-windows-llvm-mingw.ps1 `
            -Release "20260616" `
            -Version "22.1.8" `
            -ArchiveUrl "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip" `
            -Sha256 "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"

      - name: Initialize the matching MinGW LLVM development environment
        id: msys2
        if: matrix.llvm_mode == 'ON'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true

      - name: Install and validate LLVM 22.1.8 development files
        if: matrix.llvm_mode == 'ON'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -U --noconfirm --needed \
            https://mirror.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-llvm-libs-22.1.8-2-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-llvm-tools-22.1.8-2-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-llvm-22.1.8-2-any.pkg.tar.zst
          test "$(/clang64/bin/llvm-config.exe --version)" = "22.1.8"
          /clang64/bin/lli.exe --version

      - name: Configure
        shell: pwsh
        run: |
          $buildDirectory = "build/ci-windows-llvm-mingw-${{ matrix.configuration }}-llvm-${{ matrix.llvm_mode }}"
          $arguments = @(
            "-S", ".",
            "-B", $buildDirectory,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=${{ matrix.configuration }}",
            "-DCMAKE_C_COMPILER=$env:LLVM_MINGW_ROOT/bin/clang.exe",
            "-DCMAKE_CXX_COMPILER=$env:LLVM_MINGW_ROOT/bin/clang++.exe",
            "-DCMAKE_RC_COMPILER=$env:LLVM_MINGW_ROOT/bin/llvm-windres.exe",
            "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF",
            "-DFSIM_BUILD_TESTS=ON",
            "-DFSIM_TCL_MODE=ON",
            "-DFSIM_LLVM_MODE=${{ matrix.llvm_mode }}",
            "-DFSIM_WARNINGS_AS_ERRORS=ON"
          )
          if ("${{ matrix.llvm_mode }}" -eq "ON") {
            $msys2Root = "${{ steps.msys2.outputs.msys2-location }}".Replace('\', '/')
            $llvmDirectory = "$msys2Root/clang64/lib/cmake/llvm"
            $llvmConfig = "$llvmDirectory/LLVMConfig.cmake"
            if (-not (Test-Path -LiteralPath $llvmConfig -PathType Leaf)) {
              throw "LLVMConfig.cmake was not installed at $llvmConfig"
            }
            $arguments += "-DLLVM_DIR=$llvmDirectory"
          }
          & cmake @arguments

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:LLVM_MINGW_ROOT/bin;$env:LLVM_MINGW_ROOT/busybox/bin;$env:PATH"
          cmake --build "build/ci-windows-llvm-mingw-${{ matrix.configuration }}-llvm-${{ matrix.llvm_mode }}" --parallel 4

      - name: Test
        shell: pwsh
        env:
          CTEST_OUTPUT_ON_FAILURE: '1'
        run: |
          $env:PATH = "$env:LLVM_MINGW_ROOT/bin;$env:LLVM_MINGW_ROOT/busybox/bin;$env:PATH"
          ctest --test-dir "build/ci-windows-llvm-mingw-${{ matrix.configuration }}-llvm-${{ matrix.llvm_mode }}" --parallel 4 --progress --output-on-failure -LE '^recursive-closure$'
