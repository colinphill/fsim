# SPDX-License-Identifier: Apache-2.0
schema = 3

[project]
name = "precompiled-library-consumer"
top = "sv:work.tb"
time_resolution = "1ns"

[[source_set]]
language = "systemverilog"
standard = "2017"
library = "work"
files = ["tb.sv"]
compilation_unit = "source-set"

[[library_map]]
library = "vendor"
path = "../artifacts/vendor.fsimlib"

[elaboration]
search_libraries = ["vendor"]

[build]
optimization = "O2"
jobs = 0
cache_path = ".fsim-cache"

[run]
duration = "10ns"
max_deltas = 100000
trace_file = "precompiled_library.vcd"
trace_filters = ["tb.*"]
