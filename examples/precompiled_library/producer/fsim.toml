# SPDX-License-Identifier: Apache-2.0
schema = 3

[project]
name = "precompiled-library-producer"
top = "sv:vendor.library_child"
time_resolution = "1ns"

[[source_set]]
language = "systemverilog"
standard = "2017"
library = "vendor"
files = ["library_child.sv"]
compilation_unit = "source-set"

[build]
optimization = "O2"
jobs = 0
cache_path = ".fsim-cache"
