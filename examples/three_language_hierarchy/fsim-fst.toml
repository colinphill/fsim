# SPDX-License-Identifier: Apache-2.0
schema = 2

[project]
name = "three-language-hierarchy-fst"
top = "sv:work.three_language_tb"
time_resolution = "1ns"
seed = 1

[[source_set]]
language = "systemverilog"
standard = "2017"
library = "work"
files = ["three_language_tb.sv"]
compilation_unit = "source-set"

[[source_set]]
language = "systemc"
standard = "2023-subset"
library = "models"
files = ["mixed_bridge.cpp"]

[[source_set]]
language = "vhdl"
standard = "2008"
library = "models"
files = ["logic_stage.vhd"]

[elaboration]
search_libraries = ["models"]

[build]
optimization = "O2"
jobs = 0
cache_path = ".fsim-cache-fst"

[run]
duration = "10ns"
max_deltas = 100000
delay_mode = "typ"
trace_file = "three_language.fst"
trace_format = "fst"
trace_compression = "deterministic"
trace_filters = ["three_language_tb.*"]
